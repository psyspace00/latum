<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mein medizinisches Latum</title>
  <meta name="description" content="Anatomische Fachbegriffe Latein/Deutsch mit Grafiken – für Medizin- und Pflegeausbildung">
  <meta name="theme-color" content="#f6f7f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1514" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Latum">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Leuchteffekt für hervorgehobene Strukturen in den Grafiken -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="d"/>
      <feFlood flood-color="#14b8a6"/>
      <feComposite in2="d" operator="in" result="c"/>
      <feGaussianBlur in="c" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </svg>

  <header class="topbar" id="topbar">
    <button class="back" id="backBtn" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="title" id="title">Latum</h1>
    <div class="seg" id="langSeg" role="group" aria-label="Hauptsprache">
      <button data-lang="lat" aria-label="Latein zuerst">LA</button>
      <button data-lang="de" aria-label="Deutsch zuerst">DE</button>
    </div>
    <div class="search" id="searchWrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input id="search" type="search" placeholder="Suchen" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Körperteil suchen">
      <button class="search-clear" id="searchClear" aria-label="Suche löschen" hidden>×</button>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button data-tab="koerper"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.3"/><path d="M12 8v7M7 10.5l5-1.5 5 1.5M12 15l-3 6.5M12 15l3 6.5"/></svg><span>Körper</span></button>
    <button data-tab="lernen"><svg viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="12" height="14" rx="2"/><path d="M8.5 3.5h10a2 2 0 0 1 2 2v12"/></svg><span>Lernen</span></button>
    <button data-tab="favoriten"><svg viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.8l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg><span>Gemerkt</span></button>
    <button data-tab="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg><span>Info</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>

  <script src="data.js"></script>
  <script src="figures.js"></script>
  <script src="app.js"></script>
</body>
</html>
