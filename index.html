<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MediSmart</title>
  <meta name="description" content="MediSmart – Lern-App für die Pflegeausbildung (Alten- und Krankenpflege) mit optionaler Medizin-Vertiefung">
  <meta name="author" content="Maximilian Riehn">
  <meta name="copyright" content="© 2026 Maximilian Riehn. Alle Rechte vorbehalten.">
  <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MediSmart">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="figuren.css">
</head>
<body>
  <!-- Leuchteffekt für hervorgehobene Strukturen in den Querschnitt-Grafiken -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="d"/>
      <feFlood flood-color="#14b8a6"/>
      <feComposite in2="d" operator="in" result="c"/>
      <feGaussianBlur in="c" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </svg>

  <!-- iOS-artige Navigationsleiste (Glas) -->
  <header class="nav" id="nav">
    <button class="nav-back" id="backBtn" hidden aria-label="Zurück">
      <svg viewBox="0 0 24 24"><path d="M15 4.5L7.5 12l7.5 7.5"/></svg><span id="backLabel">Zurück</span>
    </button>
    <div class="nav-title" id="navTitle"></div>
    <div class="nav-right">
      <div class="seg" id="langSeg" role="group" aria-label="Sprache / Ngôn ngữ">
        <button data-lang="de" aria-label="Deutsch">DE</button>
        <button data-lang="vi" aria-label="Tiếng Việt">VI</button>
      </div>
      <div class="search" id="searchWrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="search" type="search" placeholder="Suchen" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Körperteil oder Thema suchen">
        <button class="search-clear" id="searchClear" aria-label="Suche löschen" hidden>×</button>
      </div>
      <button class="search-cancel" id="searchCancel">Abbrechen</button>
    </div>
  </header>

  <!-- Seitenstapel: jede Seite gleitet wie in iOS herein -->
  <main id="stage" class="stage"></main>
  <div id="searchLayer" class="search-layer" hidden></div>

  <nav class="tabbar">
    <button data-tab="start"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/></svg><span>Start</span></button>
    <button data-tab="lernen"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 8.5h8M8 12.5h5M8.5 16.5l1.5 1.5 3-3"/></svg><span>Lernen</span></button>
    <button data-tab="test"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5M12 3v3"/></svg><span>Test-Vorbereitung</span></button>
    <button data-tab="gemerkt"><svg viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.8l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg><span>Gemerkt</span></button>
    <button data-tab="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg><span>Info</span></button>
    <button data-tab="installieren"><svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 7v7.5M9 11.8l3 3 3-3M10.5 18.5h3"/></svg><span>Installieren</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
  <div class="update-layer" id="updateLayer" hidden></div>

  <script src="schutz.js"></script>
  <script src="data.js"></script>
  <script src="figures.js"></script>
  <script src="modelle.js"></script>
  <script src="pflege.js"></script>
  <script src="quiz.js"></script>
  <script src="diagnosen.js"></script>
  <script src="vi_anatomie.js"></script>
  <script src="vi_pflege.js"></script>
  <script src="vi_quiz.js"></script>
  <script src="sprache.js"></script>
  <script src="version.js"></script>
  <script src="app.js"></script>
</body>
</html>
